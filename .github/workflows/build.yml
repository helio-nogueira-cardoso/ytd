name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ytd-linux
            binary: ytd
          - os: windows-latest
            artifact: ytd-windows
            binary: ytd.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name ytd --collect-all imageio_ffmpeg --collect-all yt_dlp --collect-all curl_cffi main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mkdir release
          cp artifacts/ytd-linux/ytd release/ytd-linux
          cp artifacts/ytd-windows/ytd.exe release/ytd-windows.exe
          chmod +x release/ytd-linux

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ytd-linux
            release/ytd-windows.exe
